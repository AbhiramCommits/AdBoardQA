name: adboardqa

services:
  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - '3001:3001'
    environment:
      PORT: '3001'
      DATA_FILE: /data/db.json
    volumes:
      - adboard-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - '5173:5173'
    environment:
      VITE_API_PROXY: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  cypress:
    profiles: ['test']
    build:
      context: .
      dockerfile: cypress/Dockerfile
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      CYPRESS_BASE_URL: http://web:5173
    volumes:
      - ./cypress/reports:/repo/cypress/reports
      - ./cypress/videos:/repo/cypress/videos
      - ./cypress/screenshots:/repo/cypress/screenshots
    command: ['npx', 'cypress', 'run']

volumes:
  adboard-data:
